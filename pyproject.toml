[project]
name = "roboticxs"
version = "0.1.0"
description = "Roboticxs Stage 1 text-only control loop"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1.0",
  "sqlalchemy>=1.4,<2.1",
  "uvicorn>=0.29,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "httpx>=0.27,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
